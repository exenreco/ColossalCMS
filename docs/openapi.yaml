openapi: 3.1.0
info:
  title: Colossal CMS API
  version: 0.0.3
  description: Server-authorized CMS operations. Admin endpoints require a verified hosting-platform session and a CMS role. Mutations also require a same-origin Origin header and application/json, except file uploads which use multipart/form-data.
servers:
  - url: /api
components:
  securitySchemes:
    readKey:
      type: http
      scheme: bearer
  schemas:
    ViewSeries:
      type: object
      properties:
        current: { type: integer, minimum: 0 }
        previous: { type: integer, minimum: 0 }
        currentSeries:
          type: array
          items: { type: integer, minimum: 0 }
        previousSeries:
          type: array
          items: { type: integer, minimum: 0 }
    ViewAnalytics:
      type: object
      description: Last 30 days compared with the preceding 30 days. Daily UTC buckets include partial boundary days; no visitor identifiers are collected. History is retained for 60 days.
      properties:
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        previousStart: { type: string, format: date-time }
        labels:
          type: array
          items: { type: string, format: date }
        previousLabels:
          type: array
          items: { type: string, format: date }
        page: { $ref: "#/components/schemas/ViewSeries" }
        post: { $ref: "#/components/schemas/ViewSeries" }
    Content:
      type: object
      required: [kind, title, slug, body, excerpt, status]
      properties:
        id: { type: string }
        templateId:
          {
            type: string,
            description: Optional active-theme template override; missing IDs fall back without destroying content,
          }
        kind: { type: string, enum: [page, post] }
        title: { type: string, minLength: 1, maxLength: 200 }
        slug:
          { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", maxLength: 160 }
        body: { type: string, maxLength: 100000 }
        excerpt: { type: string, maxLength: 500 }
        status: { type: string, enum: [draft, pending, published, scheduled] }
        publishAt: { type: string, format: date-time }
        views30Days:
          type: integer
          minimum: 0
          readOnly: true
          description: Public document loads in the rolling last 30 days; returned in admin state only.
        expectedUpdatedAt:
          { type: string, description: Optimistic concurrency token }
        autosave:
          {
            type: boolean,
            description: Published content saves to a private revision,
          }
        author: { type: string }
        details:
          type: object
          properties:
            richText:
              { type: object, description: Validated Tiptap document JSON }
            featuredImageId: { type: string }
            categories: { type: array, items: { type: string } }
            tags: { type: array, items: { type: string } }
            metaTitle: { type: string, maxLength: 200 }
            metaDescription: { type: string, maxLength: 500 }
            panelData:
              { type: object, description: Namespaced custom panel values }
    Settings:
      type: object
      required: [title, tagline, announcement]
      properties:
        title: { type: string, maxLength: 80 }
        tagline: { type: string, maxLength: 200 }
        accent:
          {
            type: string,
            pattern: "^#[0-9a-fA-F]{6}$",
            description: Legacy fallback frontend color; public themes own their appearance,
          }
        adminColorMode:
          {
            type: string,
            enum: [light, dark, system],
            default: system,
            description: Workspace-wide appearance for the dashboard and every editor,
          }
        announcement: { type: string, maxLength: 240 }
        siteIconId: { type: string }
        postRouting: { type: string, enum: [home, page] }
        postsPageId:
          { type: string, description: Published page for the post index }
        homePageId:
          { type: string, description: Optional separate published homepage }
    OutlineNode:
      type: object
      required: [id, type, label, icon, summary, movable, removable]
      properties:
        id: { type: string }
        type: { type: string }
        label: { type: string }
        icon: { type: string }
        summary: { type: string }
        movable: { type: boolean }
        removable: { type: boolean }
        children:
          type: array
          items: { $ref: "#/components/schemas/OutlineNode" }
    ThemeOutline:
      type: object
      required: [apiVersion, themeId, templateId, part, revision, status, root]
      properties:
        apiVersion: { type: integer, const: 1 }
        themeId: { type: string }
        templateId: { type: [string, "null"] }
        part: { type: [string, "null"] }
        revision: { type: integer }
        status: { type: string, enum: [draft, published] }
        root: { $ref: "#/components/schemas/OutlineNode" }
        selectedId: { type: string, description: Present after a command }
  responses:
    Error:
      description: Validation, authentication, authorization, or persistence error
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
paths:
  /admin/analytics/views:
    get:
      summary: Read core analytics totals for a plugin target type
      description: Administrator-only rolling 30-day document views by target ID. Maintenance views count public HTTP 503 document loads separately from page/post totals. Editor renders, previews, HEAD and prefetch requests are excluded. This is a read endpoint; plugins cannot submit views from the browser.
      parameters:
        - in: query
          name: type
          required: true
          schema: { type: string, pattern: "^[a-z][a-z0-9._-]{0,79}$" }
          example: maintenance
      responses:
        "200":
          description: Counts for targets with views; missing IDs have zero views
          content:
            application/json:
              schema:
                type: object
                properties:
                  type: { type: string }
                  days: { type: integer, const: 30 }
                  start: { type: string, format: date-time }
                  end: { type: string, format: date-time }
                  counts:
                    type: object
                    additionalProperties: { type: integer, minimum: 0 }
        "400": { description: Invalid target type }
        "401": { description: Sign-in required }
        "403": { description: Administrator access required }
  /admin/seo/index:
    post:
      summary: Submit a published indexable entry to IndexNow (authenticated member, same origin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentId]
              properties:
                contentId: { type: string, maxLength: 160 }
      responses:
        "200":
          description: Provider accepted the submission or is verifying the key; indexing is not guaranteed
        "400":
          description: Content is not eligible for indexing
        "409":
          description: SEO or IndexNow is not configured, or request is not from the production origin
        "429":
          description: Provider rate limit reached
        "502":
          description: Provider unreachable or rejected the submission
  /admin/seo:
    get:
      summary: Read Advanced SEO publisher and schema defaults (admin only)
      responses:
        "200":
          description: SEO settings
        "403":
          description: Administrator access required
    post:
      summary: Validate and save Advanced SEO defaults (admin only, same origin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                siteUrl:
                  {
                    type: string,
                    description: Optional production HTTP(S) origin,
                  }
                publisherType: { type: string, enum: [Person, Organization] }
                publisherName: { type: string, maxLength: 200 }
                publisherLogo: { type: string }
                defaultPostSchema: { type: string }
                defaultPageSchema: { type: string }
                breadcrumbs: { type: boolean }
                indexNowEnabled: { type: boolean, default: false }
                indexNowKey:
                  {
                    type: string,
                    maxLength: 128,
                    description: Public domain-verification key,
                  }
      responses:
        "200":
          description: Settings saved
        "400":
          description: Invalid SEO configuration
        "403":
          description: Administrator access or same-origin request required
  /admin/editor/preferences:
    get:
      summary: Read the authenticated member's editor preferences
      responses:
        "200":
          description: User-scoped walkthrough completion; legacy colorMode is retained for compatibility and does not override Settings Appearance
          content:
            application/json:
              schema:
                type: object
                properties:
                  colorMode: { type: string, enum: [light, dark] }
                  walkthroughVersion: { type: integer, enum: [0, 1] }
    put:
      summary: Update the authenticated member's editor preferences
      description: Same-origin JSON request. The session determines the member; arbitrary user IDs and unknown fields are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                colorMode: { type: string, enum: [light, dark] }
                walkthroughVersion: { type: integer, const: 1 }
      responses:
        "200": { description: Updated preferences }
        "400": { description: Invalid preference fields }
        "401": { description: Sign-in required }
        "403": { description: Invalid Origin or workspace membership }
  /public:
    get:
      summary: Public configuration, active plugins, and publishable content
      responses:
        "200":
          {
            description: "Settings, plugins, media and content; drafts excluded",
          }
  /content:
    get:
      summary: Read published content through an integration key
      security: [{ readKey: [] }]
      responses:
        "200": { description: Published and due scheduled entries }
        "401": { $ref: "#/components/responses/Error" }
  /admin/session:
    get:
      summary: Check setup status and the verified member session
      responses:
        "200": { description: Setup required or authenticated member }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/setup:
    post:
      summary: Create the first owner and seed sample content while Site is owner-private
      responses:
        "200": { description: Workspace initialized }
        "409": { $ref: "#/components/responses/Error" }
  /admin/state:
    get:
      summary: Load member-authorized workspace state
      responses:
        "200":
          description: "Content with views30Days, viewAnalytics, settings, plugins, media, notices and activity; members and key metadata for admins only"
          content:
            application/json:
              schema:
                type: object
                properties:
                  viewAnalytics: { $ref: "#/components/schemas/ViewAnalytics" }
        "401": { $ref: "#/components/responses/Error" }
  /admin/content:
    post:
      summary: Create or update a page or post; administrator or editor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Content" }
      responses:
        "200": { description: Saved content ID }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/content/{id}:
    delete:
      summary: Delete a page or post
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
  /admin/plugins:
    post:
      summary: Change a bundled optional plugin; administrator only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, action]
              properties:
                id: { type: string }
                action:
                  {
                    type: string,
                    enum: [install, activate, deactivate, uninstall],
                  }
      responses:
        "200": { description: Plugin updated }
        "403": { $ref: "#/components/responses/Error" }
  /admin/settings:
    post:
      summary: Save all site settings; administrator only
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Settings" }
      responses:
        "200": { description: Settings saved }
        "400": { $ref: "#/components/responses/Error" }
  /admin/members:
    post:
      summary: Add or change a member by email; administrator only, no invitation email sent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [admin, editor] }
      responses:
        "200": { description: Membership saved }
  /admin/members/{id}:
    delete:
      summary: Revoke membership, excluding the owner and self
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Membership removed }
  /admin/keys:
    post:
      summary: Generate a read-only API key; raw key returned once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 80 }
      responses:
        "200": { description: Raw key; save securely }
  /admin/keys/{id}:
    delete:
      summary: Revoke an API key
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: API key revoked }

  /media:
    get:
      summary: List media for an authenticated administrator or editor
      responses:
        "200": { description: Media items with stable URLs and metadata }
        "401": { $ref: "#/components/responses/Error" }
    post:
      summary: Upload a validated image, PDF, audio, video or 3D model file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                altText: { type: string, description: Required for images }
                metadata:
                  {
                    type: string,
                    description: JSON containing optional duration in seconds,
                  }
      responses:
        "201": { description: Saved MediaItem }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /media/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      summary: Edit name, altText, caption, description and tags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, altText, caption, description, tags]
              properties:
                name: { type: string, maxLength: 200 }
                altText: { type: string, maxLength: 500 }
                caption: { type: string, maxLength: 1000 }
                description: { type: string, maxLength: 5000 }
                tags:
                  {
                    type: array,
                    maxItems: 30,
                    items: { type: string, maxLength: 80 },
                  }
      responses:
        "200": { description: Updated MediaItem }
    delete:
      summary: Delete an unused media file
      responses:
        "200": { description: Deleted }
        "409":
          {
            description: Media is referenced; response includes references array,
          }
  /media/{id}/replace:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Replace file while keeping its media ID and type
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                altText: { type: string }
      responses:
        "200": { description: Updated MediaItem with same ID }
  /media/{id}/references:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: List content, revision and settings references
      responses:
        "200":
          description: "Reference array containing title, kind, id and published"
  /media/{id}/file:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Read media; unpublished and unreferenced files require a CMS session
      parameters:
        - {
            name: Range,
            in: header,
            schema: { type: string },
            description: Single bytes range,
          }
      responses:
        "200": { description: Complete file with validated content type }
        "206": { description: Requested byte range }
        "401": { $ref: "#/components/responses/Error" }
        "416": { description: Invalid byte range }
    head:
      summary: Read file headers with the same authorization as GET
      responses:
        "200": { description: File headers }
  /admin/content/{id}/revisions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Read saved and autosaved content snapshots
      responses:
        "200":
          { description: Revision array; restore through POST /admin/content }
  /admin/notices/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      summary: Dismiss a dashboard routing notice
      responses:
        "200": { description: Dismissed }
  /plugins/install:
    post:
      summary: Validate and store an uploaded ZIP as an inactive plugin
      description: Administrator only. Maximum compressed size 25 MB. No uploaded code executes.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201": { description: Installed inactive plugin metadata and revision }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409":
          description: "Conflicting route, version, or pending installation"
        "413": { $ref: "#/components/responses/Error" }
  /plugins/{id}/{action}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - name: action
        in: path
        required: true
        schema:
          {
            type: string,
            enum: [activate, deactivate, rollback, discard, uninstall],
          }
    post:
      summary: Manage an uploaded plugin package
      description: Administrator only. Activate currently returns 403 because trusted runtime execution approval is pending. Rollback restores previous files and manifest inactive. Discard reverts a pending installation.
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: Operation completed }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /themes:
    get:
      summary: List installed themes and template metadata
      description: Requires a CMS member. Includes active/core status, revision, and hasDraft.
      responses:
        "200": { description: Theme summary array }
  /themes/active:
    get:
      summary: Get the active theme manifest for the content editor
      responses:
        "200": { description: Active theme manifest }
  /themes/install:
    post:
      summary: Validate and install a theme ZIP inactive
      description: Administrator only. 25 MB compressed limit. Validates archive integrity, manifest, paths, compatibility and media. Sanitizes HTML and CSS; removes scripts and returns a summary.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201": { description: Installed ID and sanitization report }
        "400": { $ref: "#/components/responses/Error" }
        "409": { description: Theme ID already installed }
        "413": { description: Archive exceeds limit }
  /themes/render:
    get:
      summary: Render the active published theme or a signed draft preview
      parameters:
        - { name: path, in: query, schema: { type: string, default: / } }
        - { name: q, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - {
            name: themePreview,
            in: query,
            schema: { type: string },
            description: Signed 15-minute token bound to a theme revision,
          }
      responses:
        "200":
          {
            description: Sanitized html,
            scoped css,
            templateId,
            warning,
            page status,
            title and description,
          }
        "401": { description: Invalid or expired preview token }
        "410": { description: Preview revision changed }
  /themes/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Read published document, draft, revision and version history
      description: Administrator only.
      responses:
        "200": { description: Theme record }
    delete:
      summary: Delete an inactive non-core theme and its assets/history
      description: Administrator only. Send an empty JSON object.
      responses:
        "200": { description: Deleted }
        "403": { description: Core themes cannot be deleted }
        "409": { description: Activate another theme first }
  /themes/{id}/outline:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Read the versioned outline of a theme template or shared part
      description: Administrator session required. Uses the current draft when available; draft=false selects published content.
      parameters:
        - {
            name: templateId,
            in: query,
            schema: { type: string },
            description: Defaults to the landing or Home template,
          }
        - {
            name: part,
            in: query,
            schema: { type: string },
            description: Selects the shared part instead of a template,
          }
        - { name: draft, in: query, schema: { type: boolean, default: true } }
      responses:
        "200":
          description: Versioned block tree and theme revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThemeOutline" }
        "401": { description: Sign-in required }
        "403": { description: Administrator access required }
        "404": { description: "Theme, template or shared part not found" }
    post:
      summary: Apply one outline command to a private draft
      description: Administrator session, same-origin Origin header and current revision required. Commands share the editor's structural rules. Does not publish, activate or modify blob ownership.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, command]
              properties:
                apiVersion: { type: integer, const: 1 }
                revision: { type: integer }
                templateId: { type: string }
                part: { type: string }
                command:
                  type: object
                  required: [type]
                  properties:
                    type:
                      {
                        type: string,
                        enum:
                          [
                            insert,
                            move,
                            duplicate,
                            remove,
                            update,
                            rename,
                            icon,
                            paste,
                          ],
                      }
                    id: { type: string }
                    parentId: { type: string }
                    index: { type: integer, minimum: 0 }
                    blockType: { type: string }
                    settings: { type: object }
                    label: { type: string, minLength: 1, maxLength: 80 }
                    icon: { type: string }
                    node:
                      {
                        type: object,
                        description: Block subtree to paste with regenerated IDs,
                      }
            example:
              apiVersion: 1
              revision: 3
              templateId: home
              command: { type: rename, id: blk_heading, label: Hero title }
      responses:
        "200":
          description: Updated outline with selection and incremented draft revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThemeOutline" }
        "400": { description: "Invalid command, metadata or structure" }
        "401": { description: Sign-in required }
        "403":
          { description: Administrator access or same-origin validation failed }
        "404": { description: "Theme, template or shared part not found" }
        "409": { description: Revision is stale; reload before retrying }
  /themes/{id}/draft:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      summary: Validate and save an editor document as a private draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, document]
              properties:
                revision: { type: integer }
                document:
                  {
                    type: object,
                    description: Theme manifest,
                    template/part block trees,
                    custom definitions and CSS; asset identities are server-owned,
                  }
      responses:
        "200": { description: Incremented revision }
        "409": { description: Theme changed in another tab }
  /themes/{id}/templates/{templateId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: templateId, in: path, required: true, schema: { type: string } }
    put:
      summary: Replace one template root in the draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, root]
              properties:
                revision: { type: integer }
                root:
                  {
                    type: object,
                    description: Container block tree with nesting up to 8 levels,
                  }
      responses:
        "200": { description: Incremented revision }
        "409": { description: Stale revision }
  /themes/{id}/render:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Render an unsaved document with published sample content for the editor
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [document]
              properties:
                document: { type: object }
                templateId: { type: string }
                part: { type: string, enum: [header, footer, sidebar] }
      responses:
        "200": { description: Sanitized html and css }
  /themes/{id}/export:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Download an installable ZIP of the draft or published theme
      responses:
        "200":
          description: ZIP including manifest, block tree, compiled templates, parts, blocks and assets
          content:
            application/zip:
              schema: { type: string, format: binary }
  /themes/{id}/assets/{file}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: file, in: path, required: true, schema: { type: string } }
    get:
      summary: Read a validated theme-owned media asset
      description: Active theme assets are public. Inactive themes require membership or a valid preview token.
      parameters:
        - { name: themePreview, in: query, schema: { type: string } }
      responses:
        "200": { description: Media bytes with verified MIME and nosniff }
  /themes/{id}/{action}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - name: action
        in: path
        required: true
        schema:
          {
            type: string,
            enum: [activate, publish, preview, clone, revert, restore],
          }
    post:
      summary: Manage a theme version or activation
      description: Administrator only. All actions except preview require revision. Publish bumps patch and saves history. Restore creates a draft. Activate reports content fallbacks. Preview issues a signed URL. Optional templateId and part are bound into the signed URL; arbitrary public query parameters cannot change this selection.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                revision: { type: integer }
                name: { type: string, description: Required for clone }
                historyId: { type: string, description: Required for restore }
                templateId:
                  { type: string, description: Optional preview template ID }
                part:
                  {
                    type: string,
                    description: Optional preview shared-part name,
                  }
                draft:
                  {
                    type: boolean,
                    default: true,
                    description: Preview saved draft when available,
                  }
      responses:
        "200": { description: Operation result, fallback list, or preview URL }
        "201": { description: Cloned theme ID }
        "409": { description: Stale revision }
